[[actions]]
name = "analytics.encounters.view"
domain = "analytics"
zone = "web"
description = "View encounter analytics scoped by admin, hospital, or lab-unit grants."
resource_type = "encounter"
requires_resource = false

# KPI reporting is registered per family so each can diverge, and each family
# separates its aggregate surface from its row-level one. Aggregates report a
# lab's own throughput and are deliberately not project-gated; anything that
# returns rows, identifiers or an export is a disclosure and stays gated.

[[actions]]
name = "analytics.kpi.encounter_files.view"
domain = "analytics"
zone = "api"
description = "View aggregate encounter-file KPIs: counts, distributions and upload trends."
resource_type = "encounter_file"
requires_resource = false

[[actions]]
name = "analytics.kpi.encounter_files.rows"
