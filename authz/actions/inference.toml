# WAI / remote inference results. Reach follows lab-unit allocation on both
# sides of the project boundary, and additionally follows upload profile
# assignments: an automated Remidio API pull has no uploading user by design,
# so a field role reaches the inferences run on it through the lab units its
# profiles cover, never through ownership. Ownership is offered as a filter
# over that set, not as the gate.

[[actions]]
name = "inference.wai.summary"
domain = "inference"
zone = "api"
description = "View aggregate WAI inference statistics: counts and status distributions."
resource_type = "inference_run"
requires_resource = false

[[actions]]
name = "inference.wai.rows"
domain = "inference"
zone = "api"
description = "Read the per-image or per-encounter WAI inference result rows, including patient identifiers."
resource_type = "inference_run"
requires_resource = false

[[actions]]
name = "inference.wai.retry"
domain = "inference"
zone = "api"
description = "Re-queue a failed WAI inference run."
resource_type = "inference_run"
requires_resource = true

[[actions]]
name = "inference.wai.run"
domain = "inference"
zone = "api"
description = "Request a WAI inference on a grading task, inside or outside a project."
resource_type = "grading_task"
requires_resource = true
