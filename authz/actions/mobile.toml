# Mobile and field-capture actions.
#
# Every action here is reached with a device-bound JWT (auth.decorators
# .token_auth_required) rather than a session cookie, and each one resolves
# its project scope through field_workbench.service.resolve_project_scope.

[[actions]]
name = "mobile.context.view"
domain = "mobile"
zone = "api"
description = "Read the authenticated mobile actor's own context and permissions."
resource_type = "user"
requires_resource = false

[[actions]]
name = "mobile.session.view"
domain = "mobile"
zone = "api"
description = "List or read the actor's own mobile sessions."
resource_type = "mobile_session"
requires_resource = false

[[actions]]
name = "mobile.session.revoke"
domain = "mobile"
zone = "api"
description = "Revoke one of the actor's own mobile sessions."
resource_type = "mobile_session"
requires_resource = true

[[actions]]
name = "mobile.field.project.view"
domain = "mobile"
zone = "api"
description = "List field projects the actor is assigned to."
resource_type = "project"
requires_resource = false

[[actions]]
name = "mobile.field.encounter.view"
domain = "mobile"
zone = "api"
description = "Read field encounters, images, and reports within an assigned project."
resource_type = "encounter"
requires_resource = true

[[actions]]
name = "mobile.field.encounter.capture"
domain = "mobile"
zone = "api"
description = "Refresh, fetch, or re-fetch field encounter data for an assigned project."
resource_type = "project"
requires_resource = true

[[actions]]
name = "mobile.field.inference.run"
domain = "mobile"
zone = "api"
description = "Trigger or retry inference for a field encounter."
resource_type = "encounter"
requires_resource = true

[[actions]]
name = "mobile.upload.create"
domain = "mobile"
zone = "api"
description = "Create a mobile upload and read its status."
resource_type = "upload_selection"
requires_resource = true
