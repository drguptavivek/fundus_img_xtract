services:
  web:
    build: .
    image: fundus-img-xtract:web
    container_name: fundus-img-xtract-web
    mem_reservation: 1500m
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_APP_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - web_venv:/app/.venv
    restart: on-failure:5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:18-alpine
    container_name: fundus-img-xtract-db
    mem_reservation: 512m
    mem_limit: 1500m
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=50"

  cache:
    image: redis:7-alpine
    container_name: fundus-img-xtract-cache
    mem_reservation: 256m
    mem_limit: 512m
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # REDIS PORT is exposed to host and bound to 127.0.0.1 and not an open relay
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "sh", "-c", "exec redis-server --save 60 1 --loglevel warning --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test-db:
    image: postgres:18-alpine
    container_name: fundus-img-xtract-test-db
    mem_reservation: 256m
    mem_limit: 512m
    environment:
      POSTGRES_DB: fundus_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_change_in_production
      POSTGRES_PORT: 5438
    # No port mapping needed - internal docker network only
    # ports:
    #   - "127.0.0.1:5438:5432"
    tmpfs:
      - /var/lib/postgresql/data # In-memory for speed
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d fundus_test" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no" # Don't auto-restart test DB
    command:
      - "postgres"
      - "-c"
      - "fsync=off" # Faster for tests (not production-safe)
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=20"

volumes:
  postgres_data:
  redis_data:
  web_venv:
