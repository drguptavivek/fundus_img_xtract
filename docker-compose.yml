services:
  requirements-exporter:
    build:
      context: .
      target: requirements-exporter
    image: fundus-img-xtract:requirements-exporter
    container_name: fundus-img-xtract-requirements-exporter
    working_dir: /app
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./requirements.txt:/app/requirements.txt
      - ./requirements-web.txt:/app/requirements-web.txt
      - ./requirements-ocr.txt:/app/requirements-ocr.txt
      - ./requirements-beat.txt:/app/requirements-beat.txt
      - ./requirements-general.txt:/app/requirements-general.txt
      - uv_cache:/tmp/.uv-cache
    restart: "no"

  ocr-venv-builder:
    build:
      context: .
      target: ocr-venv-builder
    image: fundus-img-xtract:ocr-venv-builder
    container_name: fundus-img-xtract-ocr-venv-builder
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
    volumes:
      - ocr_venv:/app/.venv
      - uv_cache:/tmp/.uv-cache
    restart: "no"

  web-venv-builder:
    build:
      context: .
      target: web-venv-builder
    image: fundus-img-xtract:web-venv-builder
    container_name: fundus-img-xtract-web-venv-builder
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
    volumes:
      - web_venv:/app/.venv
      - uv_cache:/tmp/.uv-cache
    restart: "no"

  beat-venv-builder:
    build:
      context: .
      target: beat-venv-builder
    image: fundus-img-xtract:beat-venv-builder
    container_name: fundus-img-xtract-beat-venv-builder
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
    volumes:
      - beat_venv:/app/.venv
      - uv_cache:/tmp/.uv-cache
    restart: "no"

  general-venv-builder:
    build:
      context: .
      target: general-venv-builder
    image: fundus-img-xtract:general-venv-builder
    container_name: fundus-img-xtract-general-venv-builder
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
    volumes:
      - general_venv:/app/.venv
      - uv_cache:/tmp/.uv-cache
    restart: "no"

  web:
    build:
      context: .
      target: web-base
    image: fundus-img-xtract:web
    container_name: fundus-img-xtract-web
    mem_reservation: 1500m
    mem_limit: 3g
    depends_on:
      web-venv-builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_APP_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKIP_UV_SYNC: "true"
      CELERY_TASKS_PROFILE: "client"
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - ./en_US-lessac-medium.onnx:/app/en_US-lessac-medium.onnx:ro
      - ./en_US-lessac-medium.onnx.json:/app/en_US-lessac-medium.onnx.json:ro
      - web_venv:/app/.venv
    restart: on-failure:5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:18-alpine
    container_name: fundus-img-xtract-db
    mem_reservation: 512m
    mem_limit: 1500m
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=50"

  cache:
    image: redis:7-alpine
    container_name: fundus-img-xtract-cache
    mem_reservation: 256m
    mem_limit: 512m
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # REDIS PORT is exposed to host and bound to 127.0.0.1 and not an open relay
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "sh", "-c", "exec redis-server --save 60 1 --loglevel warning --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-ocr-worker:
    build:
      context: .
      target: ocr-base
    image: fundus-img-xtract:celery-ocr
    container_name: fundus-img-xtract-celery-ocr
    mem_reservation: 1g
    mem_limit: 2g
    depends_on:
      ocr-venv-builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_APP_DB}
      RUN_MIGRATIONS: "false"
      PYTHONPATH: /app
      CELERY_TASKS_PROFILE: "ocr"
      SKIP_UV_SYNC: "true"
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - ocr_venv:/app/.venv
    command: >
      uv run celery -A celery_worker worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_OCR_CONCURRENCY:-1}
      -Q zip_ocr,pii_detection,pdf_processing,metadata
    restart: on-failure:5

  celery-general-worker:
    build:
      context: .
      target: general-base
    image: fundus-img-xtract:celery-general
    container_name: fundus-img-xtract-celery-general
    mem_reservation: 512m
    mem_limit: 1g
    depends_on:
      general-venv-builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_APP_DB}
      RUN_MIGRATIONS: "false"
      SKIP_UV_SYNC: "true"
      PYTHONPATH: /app
      CELERY_TASKS_PROFILE: "general"
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - general_venv:/app/.venv
    command: >
      uv run celery -A celery_worker worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_GENERAL_CONCURRENCY:-2}
      -Q thumbnails,exports,maintenance,s3_sync,default
    restart: on-failure:5

  celery-beat:
    build:
      context: .
      target: beat-base
    image: fundus-img-xtract:celery-beat
    container_name: fundus-img-xtract-celery-beat
    mem_reservation: 128m
    mem_limit: 256m
    depends_on:
      beat-venv-builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - deploy.config.env
      - deploy.secrets.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_APP_DB}
      RUN_MIGRATIONS: "false"
      SKIP_UV_SYNC: "true"
      PYTHONPATH: /app
      CELERY_TASKS_PROFILE: "maintenance"
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - beat_venv:/app/.venv
    command: >
      uv run celery -A celery_beat_app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
    restart: on-failure:5

  test-db:
    image: postgres:18-alpine
    container_name: fundus-img-xtract-test-db
    mem_reservation: 256m
    mem_limit: 512m
    environment:
      POSTGRES_DB: fundus_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_change_in_production
      POSTGRES_PORT: 5438
    # No port mapping needed - internal docker network only
    # ports:
    #   - "127.0.0.1:5438:5432"
    tmpfs:
      - /var/lib/postgresql # In-memory for speed
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d fundus_test" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no" # Don't auto-restart test DB
    command:
      - "postgres"
      - "-c"
      - "fsync=off" # Faster for tests (not production-safe)
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=20"

volumes:
  postgres_data:
  redis_data:
  web_venv:
  beat_venv:
  general_venv:
  ocr_venv:
  uv_cache:
