# Container-friendly logrotate configuration for fundus-img-xtract

/app/logs/*.log {
    # The production web/celery containers currently run as root:root.
    su root root
    daily
    rotate 180                # keep ~180 archives (1 per day)
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        # Send HUP signal to gunicorn master process to reopen log files
        if [ -f /var/run/fundus-img-xtract/gunicorn.pid ]; then
            kill -HUP $(cat /var/run/fundus-img-xtract/gunicorn.pid) 2>/dev/null || true
        fi
    endscript
}
