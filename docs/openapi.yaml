openapi: 3.0.3
info:
  title: Fundus Image Manager API
  description: |
    RESTful API for the Fundus Image Manager - Medical imaging platform for fundus photograph grading,
    verification, and dataset curation.

    ## Authentication

    All API endpoints require authentication:
    - **Session Cookie**: For web interface access (automatic when logged in)
    - **JWT Token**: For mobile/API access (Bearer token in Authorization header)

    JWT tokens are issued per-hospital and per-device for secure mobile uploads.

    ## Authorization

    Different endpoints require different user roles:
    - `admin`: Full access to all endpoints
    - `local_admin`: Hospital administration
    - `data_manager`: Data management operations
    - `ophthalmologist`: Disease-related and grading endpoints
    - `resident`: Limited grading access
    - `optometrist`: Verification and image tagging
    - `fileUploader`: File upload operations

    ## Rate Limiting

    Upload endpoints are rate-limited (typically 60 requests per minute).

    ## Version

    Current API version: `v1` (prefix for newer endpoints)

  version: 2.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: /api
    description: Current server (relative paths)
  - url: http://localhost:5001/api
    description: Development server
  - url: https://your-domain.com/api
    description: Production server

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Diseases
    description: Disease and grading operations
  - name: Hospitals
    description: Hospital management
  - name: Lab Units
    description: Lab unit operations
  - name: Users
    description: User management
  - name: Direct Uploads
    description: Direct image upload operations
  - name: Jobs
    description: Upload job status
  - name: OCR & PII
    description: OCR text extraction and PII detection
  - name: Image Metadata
    description: Image metadata operations
  - name: Encounter Sets
    description: Multi-image set operations (Strabismus, etc.)
  - name: Viewer Settings
    description: Image viewer configuration
  - name: Upload Stats
    description: Upload statistics and metrics
  - name: Admin Users
    description: User administration
  - name: AI Models
    description: AI model management
  - name: Grading Eligibility
    description: Grading task eligibility
  - name: Scoping
    description: Access control and scoping
  - name: KPIs
    description: Key performance indicators and analytics

paths:
  # ========================================================================
  # DISEASES
  # ========================================================================
  /diseases-with-gradings:
    get:
      summary: Get all diseases with gradings
      description: Returns list of diseases with their active grading options
      tags: [Diseases]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of diseases with gradings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiseaseWithGradings'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disease-grades/{disease_id}:
    get:
      summary: Get disease grades
      description: Returns all active grading options for a specific disease
      tags: [Diseases]
      security:
        - cookieAuth: []
      parameters:
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of disease grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiseaseGrading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /diseases-gradings-features/{disease_id}:
    get:
      summary: Get disease grades with features
      description: Returns grading options with their feature definitions for UI rendering
      tags: [Diseases]
      security:
        - cookieAuth: []
      parameters:
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of disease grades with features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiseaseGradingWithFeatures'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # HOSPITALS
  # ========================================================================
  /hospitals:
    get:
      summary: Get all hospitals
      description: Returns list of hospitals (scoped to user's access)
      tags: [Hospitals]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hospitals/{hospital_id}:
    get:
      summary: Get hospital by ID
      description: Returns details of a specific hospital
      tags: [Hospitals]
      security:
        - cookieAuth: []
      parameters:
        - name: hospital_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Hospital details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hospitals/{hospital_id}/lab-units:
    get:
      summary: Get hospital lab units
      description: Returns all lab units for a hospital
      tags: [Lab Units]
      security:
        - cookieAuth: []
      parameters:
        - name: hospital_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # LAB UNITS
  # ========================================================================
  /labunits:
    get:
      summary: Get all lab units
      description: Returns list of lab units (scoped to user's access)
      tags: [Lab Units]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /labunits/{lab_unit_id}:
    get:
      summary: Get lab unit by ID
      description: Returns details of a specific lab unit
      tags: [Lab Units]
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lab unit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/hospital:
    get:
      summary: Get lab unit's hospital
      description: Returns hospital information for a lab unit
      tags: [Lab Units]
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Hospital details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # USERS
  # ========================================================================
  /users/{user_id}/lab-units:
    get:
      summary: Get user's lab units
      description: Returns lab units assigned to a user
      tags: [Users]
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # ELIGIBLE LAB UNIT
  # ========================================================================
  /eligibleLabUnit:
    get:
      summary: Get eligible lab unit
      description: Returns the user's eligible lab unit for operations
      tags: [Lab Units]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Eligible lab unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /eligibleLabUnitCurrentUser:
    get:
      summary: Get current user's eligible lab unit
      description: Returns the current user's eligible lab unit
      tags: [Users]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Eligible lab unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # DIRECT UPLOADS
  # ========================================================================
  /direct/upload:
    post:
      summary: Upload single or multiple fundus images
      description: |
        Upload one or more fundus images with associated metadata (camera, disease, area).
        Supports JPG and PNG formats. Each file validated for size, format, and duplicates.
        Returns redirect to job status page upon success.
      tags: [Direct Uploads]
      security:
        - cookieAuth: []
      parameters:
        - name: X-CSRFToken
          in: header
          description: CSRF token for form submission
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                hospital_id:
                  type: integer
                  description: Hospital ID
                  example: 1
                lab_unit_id:
                  type: integer
                  description: Lab unit ID
                  example: 5
                camera_id:
                  type: integer
                  description: Camera ID
                  example: 10
                disease_id:
                  type: integer
                  description: Disease ID
                  example: 1
                area_id:
                  type: integer
                  description: Area ID
                  example: 20
                is_mydriatic:
                  type: boolean
                  description: Pupil dilation status
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Image files (JPG/PNG, max 5MB each)
              required:
                - hospital_id
                - lab_unit_id
                - camera_id
                - disease_id
                - area_id
                - files
      responses:
        '303':
          description: Redirect to job status page
          headers:
            Location:
              schema:
                type: string
              example: /jobs/status?job_id=abc123
        '400':
          description: Validation error
          content:
            text/html:
              schema:
                type: string
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Flash message in session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /direct/pregraded:
    post:
      summary: Upload pre-graded fundus images
      description: |
        Upload one or more pre-graded fundus images with grades already assigned.
        Same validation as /direct/upload with optional dataset_label for curation.
        Admin/data_manager endpoint only.
      tags: [Direct Uploads]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                hospital_id:
                  type: integer
                lab_unit_id:
                  type: integer
                camera_id:
                  type: integer
                disease_id:
                  type: integer
                area_id:
                  type: integer
                is_mydriatic:
                  type: boolean
                dataset_label:
                  type: string
                  description: Dataset category for curation
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - hospital_id
                - lab_unit_id
                - camera_id
                - disease_id
                - area_id
                - files
      responses:
        '303':
          description: Redirect to job status page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/lab-units/{user_id}:
    get:
      summary: Get lab units for a user
      description: Returns list of lab units accessible by the specified user
      tags: [Direct Uploads]
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: List of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hospital/{lab_unit_id}:
    get:
      summary: Get hospital for a lab unit
      description: Returns hospital associated with the specified lab unit
      tags: [Direct Uploads]
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
          description: Lab unit ID
      responses:
        '200':
          description: Hospital information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # ZIP UPLOADS
  # ========================================================================
  /upload:
    post:
      summary: Upload Remedio ZIP export or batch images
      description: |
        Upload ZIP file(s) containing Remedio FOP exports, PDFs, or image sets.
        Automatically extracts images, runs OCR on PDFs, and processes metadata.
        Returns redirect to job status page. Processing is asynchronous.
      tags: [Direct Uploads]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                hospital_id:
                  type: integer
                  description: Hospital ID
                lab_unit_id:
                  type: integer
                  description: Lab unit ID
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: ZIP files (max 10MB each)
              required:
                - hospital_id
                - lab_unit_id
                - files
      responses:
        '302':
          description: Redirect to job status page
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /upload-jobs/{job_token}/status:
    get:
      summary: Get upload job status
      description: Returns the status of an async upload job
      tags: [Jobs]
      security:
        - cookieAuth: []
      parameters:
        - name: job_token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # OCR & PII DETECTION
  # ========================================================================
  /ocr/pii/{image_uuid}:
    get:
      summary: Get PII detection results
      description: Returns OCR text and detected PII for an image
      tags: [OCR & PII]
      security:
        - cookieAuth: []
      parameters:
        - name: image_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PII detection results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PIIDetectionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr/pii/boxes/{image_uuid}:
    get:
      summary: Get PII bounding boxes
      description: Returns bounding boxes for detected PII in an image
      tags: [OCR & PII]
      security:
        - cookieAuth: []
      parameters:
        - name: image_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PII bounding boxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PIIBoundingBoxes'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ocr/pii/batch:
    post:
      summary: Batch PII detection
      description: Trigger PII detection for multiple images
      tags: [OCR & PII]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - image_uuids
      responses:
        '200':
          description: Batch processing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  queued_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ocr/pii/override:
    post:
      summary: Override PII detection
      description: Manually override PII detection results for an image
      tags: [OCR & PII]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_uuid:
                  type: string
                  format: uuid
                has_pii:
                  type: boolean
                notes:
                  type: string
              required:
                - image_uuid
                - has_pii
      responses:
        '200':
          description: Override successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # IMAGE METADATA
  # ========================================================================
  /image-metadata/{image_uuid}:
    get:
      summary: Get image metadata
      description: Returns metadata for an image (tags, laterality, centering, etc.)
      tags: [Image Metadata]
      security:
        - cookieAuth: []
      parameters:
        - name: image_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Update image metadata
      description: Updates image tags and metadata
      tags: [Image Metadata]
      security:
        - cookieAuth: []
      parameters:
        - name: image_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eye_side:
                  type: string
                  enum: [left, right, cannot_tell, null]
                centering:
                  type: string
                  enum: [macula, disk, cannot_tell, null]
              required: []
      responses:
        '200':
          description: Metadata updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # ENCOUNTER SETS (Multi-Image Sets for Strabismus, etc.)
  # ========================================================================
  /v1/encounter-set/unverified:
    get:
      summary: List unverified encounter sets
      description: Returns list of set-based encounters pending verification
      tags: [Encounter Sets]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of unverified encounter sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncounterSetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/encounter-set/{uuid}/details:
    get:
      summary: Get encounter set details
      description: Returns detailed information including images for an encounter set
      tags: [Encounter Sets]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Encounter set details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncounterSetDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/encounter-set/image/{uuid}/position:
    post:
      summary: Update image spatial position
      description: Updates the grid position (1-9) of an image in an encounter set
      tags: [Encounter Sets]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          description: Image UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spatial_position:
                  type: integer
                  minimum: 1
                  maximum: 9
              required:
                - spatial_position
      responses:
        '200':
          description: Position updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Position already occupied
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Conflict'

  /v1/encounter-set/upload:
    post:
      summary: Upload image to encounter set
      description: Mobile API endpoint for uploading images to multi-image sets
      tags: [Encounter Sets]
      security:
        - bearerAuth: []
      parameters:
        - name: encounter_uuid
          in: formData
          description: Optional UUID for existing encounter
          schema:
            type: string
            format: uuid
        - name: patient_id
          in: formData
          description: Patient ID (required for new encounters)
          schema:
            type: string
        - name: patient_name
          in: formData
          description: Patient name (required for new encounters)
          schema:
            type: string
        - name: capture_date
          in: formData
          description: Capture date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: spatial_position
          in: formData
          description: Grid position (1-9)
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9
        - name: file
          in: formData
          description: Image file
          required: true
          schema:
            type: string
            format: binary
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                spatial_position:
                  type: integer
                  minimum: 1
                  maximum: 9
              required:
                - file
                - spatial_position
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncounterSetUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ========================================================================
  # VIEWER SETTINGS
  # ========================================================================
  /viewer/settings:
    get:
      summary: Get viewer settings
      description: Returns current image viewer configuration
      tags: [Viewer Settings]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Viewer settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Save viewer settings
      description: Updates image viewer configuration
      tags: [Viewer Settings]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewerSettings'
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /viewer/presets:
    get:
      summary: Get viewer presets
      description: Returns all saved viewer presets for current user
      tags: [Viewer Settings]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Viewer presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewerPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /viewer/presets/{slot_number}:
    post:
      summary: Save viewer preset
      description: Saves a viewer configuration to a preset slot
      tags: [Viewer Settings]
      security:
        - cookieAuth: []
      parameters:
        - name: slot_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                settings:
                  $ref: '#/components/schemas/ViewerSettings'
              required:
                - settings
      responses:
        '200':
          description: Preset saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Delete viewer preset
      description: Removes a viewer preset from a slot
      tags: [Viewer Settings]
      security:
        - cookieAuth: []
      parameters:
        - name: slot_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Preset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # ADMIN UPLOADS
  # ========================================================================
  /database-restore/upload:
    post:
      summary: Upload database backup for restoration
      description: |
        Upload SQL/GZ/ZIP database backup files for restoration.
        Admin-only endpoint. File is parsed to extract table count and sample data.
      tags: [Admin]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: SQL/GZ/ZIP backup file (max 100MB)
              required:
                - file
      responses:
        '200':
          description: Backup file parsed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables_found:
                    type: integer
                  user_count:
                    type: integer
                  sample_data:
                    type: object
        '400':
          description: Invalid file type or too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: File parsing or extraction error

  # ========================================================================
  # UPLOAD STATS
  # ========================================================================
  /upload-stats/today:
