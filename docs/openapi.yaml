components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Flask session cookie authentication (used by web interface)

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication (used by mobile/API clients)

  schemas:
    # ========================================================================
    # COMMON SCHEMAS
    # ========================================================================
    Disease:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        grading_scope:
          type: string
          enum: [image, encounter]
        short_name:
          type: string
        description:
          type: string
      required:
        - id
        - name

    DiseaseGrading:
      type: object
      properties:
        id:
          type: integer
        disease_id:
          type: integer
        label:
          type: string
        code:
          type: string
        display_order:
          type: integer
        is_active:
          type: boolean
        features:
          type: object
          additionalProperties: true
      required:
        - id
        - disease_id
        - label

    DiseaseWithGradings:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
        grading_scope:
          type: string
        gradings:
          type: array
          items:
            $ref: '#/components/schemas/DiseaseGrading'

    DiseaseGradingWithFeatures:
      type: object
      properties:
        id:
          type: integer
        disease_id:
          type: integer
        label:
          type: string
        code:
          type: string
        features:
          type: object
          properties:
            label:
              type: string
              description:
                type: string
              type:
                type: string
              enum: [text, select, multiselect, radio, checkbox]
              options:
                type: array
                items:
                  type: string
              default:
                type: string
            required:
              type: boolean

    # ========================================================================
    # HOSPITAL & LAB UNIT
    # ========================================================================
    Hospital:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        phone:
          type: string
        email:
          type: string
        is_active:
          type: boolean
      required:
        - id
        - name

    LabUnit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hospital_id:
          type: integer
        hospital:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        is_active:
          type: boolean
      required:
        - id
        - name

    # ========================================================================
    # USERS
    # ========================================================================
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        roles:
          type: array
          items:
            type: string
        lab_units:
          type: array
          items:
            $ref: '#/components/schemas/LabUnit'
        is_active:
          type: boolean
      required:
        - id
        - username

    # ========================================================================
    # ENCOUNTER SETS (Multi-Image)
    # ========================================================================
    EncounterSetSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        patient_id:
          type: string
        patient_name:
          type: string
        capture_date:
          type: string
          format: date
        image_count:
          type: integer
      required:
        - uuid
        - patient_id

    EncounterSetDetails:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        patient_id:
          type: string
        patient_name:
          type: string
        capture_date:
          type: string
          format: date
        images:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              spatial_position:
                type: integer
                minimum: 1
                maximum: 9
              url:
                type: string
              thumbnail_url:
                type: string
                nullable: true
      required:
        - uuid
        - patient_id
        - images

    EncounterSetUploadResponse:
      type: object
      properties:
        message:
          type: string
        encounter_id:
          type: integer
        encounter_uuid:
          type: string
          format: uuid
        image_uuid:
          type: string
          format: uuid
        spatial_position:
          type: integer
          minimum: 1
          maximum: 9
      required:
        - message
        - encounter_id

    DirectUploadResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
        message:
          type: string
        redirect_url:
          type: string

    LabUnit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Hospital:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    # ========================================================================
    # IMAGE METADATA
    # ========================================================================
    ImageMetadata:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        eye_side:
          type: string
          enum: [left, right, cannot_tell]
          nullable: true
        centering:
          type: string
          enum: [macula, disk, cannot_tell]
          nullable: true
        file_type:
          type: string
        filename:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - uuid

    # ========================================================================
    # OCR & PII
    # ========================================================================
    PIIDetectionResult:
      type: object
      properties:
        image_uuid:
          type: string
          format: uuid
        ocr_text:
          type: string
        has_pii:
          type: boolean
        confidence:
          type: number
          nullable: true
        detected_pii:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [patient_name, patient_id, barcode, other]
              text:
                type: string
              confidence:
                type: number
              bbox:
                type: object
                properties:
                  x:
                    type: number
                  y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
        processed_at:
          type: string
          format: date-time
      required:
        - image_uuid
        - has_pii

    PIIBoundingBoxes:
      type: object
      properties:
        image_uuid:
          type: string
          format: uuid
        boxes:
          type: array
          items:
            type: object
            properties:
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              label:
                type: string
              confidence:
                type: number
      required:
        - image_uuid
        - boxes

    # ========================================================================
    # UPLOAD JOBS
    # ========================================================================
    UploadJobStatus:
      type: object
      properties:
        job_id:
          type: integer
        job_token:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              state:
                type: string
              detail:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - job_id
        - status

    JobItem:
      type: object
      properties:
        filename:
          type: string
        state:
          type: string
          enum: [pending, processing, completed, failed]
        detail:
          type: string
          nullable: true

    # ========================================================================
    # VIEWER SETTINGS
    # ========================================================================
    ViewerSettings:
      type: object
      properties:
        zoom:
          type: number
          minimum: 0.1
          maximum: 5
        pan:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        brightness:
          type: number
          minimum: -100
          maximum: 100
        contrast:
          type: number
          minimum: -100
          maximum: 100
        invert:
          type: boolean
        grayscale:
          type: boolean
        rotate:
          type: number
          enum: [0, 90, 180, 270]
        flip_horizontal:
          type: boolean
        flip_vertical:
          type: boolean

    ViewerPreset:
      type: object
      properties:
        slot_number:
          type: integer
          minimum: 1
          maximum: 5
        name:
          type: string
        settings:
          $ref: '#/components/schemas/ViewerSettings'
        created_at:
          type: string
          format: date-time
      required:
        - slot_number

    # ========================================================================
    # GRADING ELIGIBILITY
    # ========================================================================
    GradingEligibility:
      type: object
      properties:
        user_id:
          type: integer
        eligible_diseases:
          type: array
          items:
            type: object
            properties:
              disease_id:
                type: integer
              disease_name:
                type: string
              eligible:
                type: boolean
              reason:
                type: string
                nullable: true
        available_tasks:
          type: object
          additionalProperties:
            type: integer

    GradingEligibilityDetails:
      type: object
      properties:
        user_id:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        eligible_diseases:
          type: array
          items:
            $ref: '#/components/schemas/Disease'
        task_counts:
          type: object
          additionalProperties:
            type: integer
        restrictions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string

    # ========================================================================
    # USER CONTEXT
    # ========================================================================
    UserHospitalContext:
      type: object
      properties:
        hospital_id:
          type: integer
          nullable: true
        hospital_name:
          type: string
          nullable: true
        lab_unit_id:
          type: integer
          nullable: true
        lab_unit_name:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string

    # ========================================================================
    # AI MODELS
    # ========================================================================
    AIModel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
        type:
          type: string
          enum: [detection, grading, segmentation, classification]
        disease_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
        accuracy:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

    # ========================================================================
    # KPIs
    # ========================================================================
    DataFrameResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        columns:
          type: array
          items:
            type: string
        total_count:
          type: integer
        filtered_count:
          type: integer

    UploadMetrics:
      type: object
      properties:
        total_uploads:
          type: integer
        unique_uploads:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_file_type:
          type: object
          additionalProperties:
            type: integer
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date

    UploadStats:
      type: object
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        by_lab_unit:
          type: object
          additionalProperties:
            type: integer

  # ========================================================================
  # RESPONSES
  # ========================================================================
  responses:
    Unauthorized:
      description: Unauthorized access
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: Unauthorized
            message: Authentication required

    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: Forbidden
            message: You don't have permission to access this resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: Not Found
            message: The requested resource was not found

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              validation_errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            error: Bad Request
            message: Invalid input data

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: Conflict
            message: The requested position is already occupied

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              retry_after:
                type: integer
          example:
            error: Too Many Requests
            message: Rate limit exceeded. Please try again later.
            retry_after: 60
