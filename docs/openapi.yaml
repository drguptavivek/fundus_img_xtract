openapi: 3.0.3
info:
  title: Fundus Image Manager API
  description: |
    RESTful API for the Fundus Image Manager application.

    ## Authentication

    All API endpoints require authentication via Flask session cookies. Users must be logged in to access the API.
    When accessing the API through a web browser that's already logged into the application, 
    authentication is handled automatically.

    For programmatic access, you must first log in through the web interface or obtain a valid session cookie
    through the authentication process.

    ## Authorization

    Different endpoints require different user roles:
    - `admin`: Full access to all endpoints
    - `data_manager`: Access to most data management endpoints
    - `ophthalmologist`: Access to disease-related and grading endpoints
    - `resident`: Limited access to specific endpoints
    - `fileUploader`: Access to upload-related endpoints
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: /api
    description: Current server (relative paths)
  - url: http://localhost:5000/api
    description: Development server
  - url: https://your-domain.com/api
    description: Production server

paths:
  /diseases:
    get:
      summary: Get all diseases
      description: Returns a list of all diseases in the system
      tags:
        - Diseases
      security:
        - cookieAuth: []
      responses:
        '200':
          description: A list of diseases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /diseases/{disease_id}:
    get:
      summary: Get disease by ID
      description: Returns details of a specific disease
      tags:
        - Diseases
      security:
        - cookieAuth: []
      parameters:
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Disease details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /diseases/{disease_id}/gradings:
    get:
      summary: Get disease gradings
      description: Returns all active gradings for a specific disease
      tags:
        - Diseases
      security:
        - cookieAuth: []
      parameters:
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of disease gradings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiseaseGrading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /diseases/{disease_id}/specialists:
    get:
      summary: Get disease specialists
      description: Returns all users specialized in a specific disease
      tags:
        - Diseases
      security:
        - cookieAuth: []
      parameters:
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of specialists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithAssociations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hospitals:
    get:
      summary: Get all hospitals
      description: Returns a list of all hospitals
      tags:
        - Hospitals
      security:
        - cookieAuth: []
      responses:
        '200':
          description: A list of hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hospitals/{hospital_id}:
    get:
      summary: Get hospital by ID
      description: Returns details of a specific hospital
      tags:
        - Hospitals
      security:
        - cookieAuth: []
      parameters:
        - name: hospital_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hospital details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hospitals/{hospital_id}/lab-units:
    get:
      summary: Get lab units for hospital
      description: Returns all lab units for a specific hospital
      tags:
        - Hospitals
      security:
        - cookieAuth: []
      parameters:
        - name: hospital_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hospitals/{hospital_id}/specializations/{disease_id}/users:
    get:
      summary: Get specialists for disease at hospital
      description: Returns all users specialized in a specific disease at a specific hospital
      tags:
        - Hospitals
      security:
        - cookieAuth: []
      parameters:
        - name: hospital_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of specialists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}:
    get:
      summary: Get lab unit by ID
      description: Returns details of a specific lab unit
      tags:
        - Lab Units
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lab unit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnitWithHospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/users:
    get:
      summary: Get users in lab unit
      description: Returns all users assigned to a specific lab unit
      tags:
        - Lab Units
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithAssociations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/upload-count:
    get:
      summary: Get upload count for lab unit
      description: Returns the count of uploads for a specific lab unit
      tags:
        - Lab Units
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Upload count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/lab-units:
    get:
      summary: Get lab units for user
      description: Returns all lab units for a specific user
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnitWithHospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/hospitals:
    get:
      summary: Get hospitals for user
      description: Returns all hospitals for a specific user (through their lab units)
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HospitalWithLabUnits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/comprehensive:
    get:
      summary: Get comprehensive user information
      description: Returns comprehensive information for a specific user including hospitals, lab units, and specializations
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Comprehensive user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprehensiveUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/diseases/{disease_id}/ophthalmologists:
    get:
      summary: Get ophthalmologist IDs for disease at lab unit
      description: Returns a simple array of user IDs for ophthalmologists specialized in a specific disease at a specific lab unit
      tags:
        - Lab Unit Disease Specialists
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Array of ophthalmologist user IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/diseases/{disease_id}/residents:
    get:
      summary: Get resident IDs for disease at lab unit
      description: Returns a simple array of user IDs for residents specialized in a specific disease at a specific lab unit
      tags:
        - Lab Unit Disease Specialists
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Array of resident user IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/diseases/{disease_id}/specialists:
    get:
      summary: Get specialists for disease at lab unit
      description: Returns all specialists (ophthalmologists and residents) for a specific disease at a specific lab unit
      tags:
        - Lab Unit Disease Specialists
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: disease_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Specialists information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnitDiseaseSpecialists'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/specialists-summary:
    get:
      summary: Get specialists summary for all diseases at lab unit
      description: Returns a summary of all specialists for each disease at a specific lab unit
      tags:
        - Lab Unit Disease Specialists
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Specialists summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnitSpecialistsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /disease-gradings/{grading_id}:
    get:
      summary: Get disease grading by ID
      description: Get a single disease grading as JSON
      tags:
        - Disease Gradings
      security:
        - cookieAuth: []
      parameters:
        - name: grading_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Disease grading details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiseaseGrading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/disease-specializations:
    get:
      summary: Get user disease specializations
      description: Get disease specializations for a user
      tags:
        - Disease Specializations
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User disease specializations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDiseaseSpecializations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Set user disease specializations
      description: Set disease specializations for a user
      tags:
        - Disease Specializations
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiseaseSpecializationRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /direct-uploads/users/{user_id}/lab-units:
    get:
      summary: Get lab units for user (Direct Uploads)
      description: Get lab units for a user
      tags:
        - Direct Uploads
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of lab units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-units/{lab_unit_id}/hospital:
    get:
      summary: Get hospital for lab unit
      description: Get hospital for a lab unit
      tags:
        - Direct Uploads
      security:
        - cookieAuth: []
      parameters:
        - name: lab_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hospital details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /upload-jobs/{job_id}/status:
    get:
      summary: Get upload job status
      description: Get status of a direct upload job
      tags:
        - Direct Uploads
      security:
        - cookieAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Upload job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{job_token}:
    get:
      summary: Get upload job status by token
      description: Get job status as JSON
      tags:
        - Jobs
      security:
        - cookieAuth: []
      parameters:
        - name: job_token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJobStatusByToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Authentication is handled via Flask session cookies. 
        Users must be logged in to access the API endpoints.
        The session cookie is automatically included in requests when browsing through the web interface.

  schemas:
    Disease:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name

    DiseaseGrading:
      type: object
      properties:
        id:
          type: integer
          format: int64
        disease_id:
          type: integer
          format: int64
        impression:
          type: string
        display_order:
          type: integer
        is_active:
          type: boolean
      required:
        - id
        - disease_id
        - impression
        - display_order
        - is_active

    Hospital:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name

    LabUnit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hospital_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - hospital_id

    LabUnitWithHospital:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hospital_id:
          type: integer
          format: int64
        hospital_name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - hospital_id

    HospitalWithLabUnits:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        lab_unit_ids:
          type: array
          items:
            type: integer
            format: int64
        lab_unit_names:
          type: array
          items:
            type: string
      required:
        - id
        - name

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
      required:
        - id
        - username

    UserWithAssociations:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        hospital_ids:
          type: array
          items:
            type: integer
            format: int64
        lab_unit_ids:
          type: array
          items:
            type: integer
            format: int64
        lab_unit_names:
          type: array
          items:
            type: string
      required:
        - id
        - username

    UploadCount:
      type: object
      properties:
        lab_unit_id:
          type: integer
          format: int64
        upload_count:
          type: integer
      required:
        - lab_unit_id
        - upload_count

    ComprehensiveUser:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserWithRoles'
        hospitals:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'
        lab_units:
          type: array
          items:
            $ref: '#/components/schemas/LabUnitWithHospital'
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/Disease'
        hospital_ids:
          type: array
          items:
            type: integer
            format: int64
        lab_unit_ids:
          type: array
          items:
            type: integer
            format: int64
        lab_unit_names:
          type: array
          items:
            type: string
        specialization_ids:
          type: array
          items:
            type: integer
            format: int64
        specialization_names:
          type: array
          items:
            type: string
      required:
        - user
        - hospitals
        - lab_units
        - specializations
        - hospital_ids
        - lab_unit_ids
        - lab_unit_names
        - specialization_ids
        - specialization_names

    UserWithRoles:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: string
      required:
        - id
        - username
        - roles

    LabUnitDiseaseSpecialists:
      type: object
      properties:
        lab_unit:
          $ref: '#/components/schemas/LabUnitReference'
        disease:
          $ref: '#/components/schemas/DiseaseReference'
        ophthalmologists:
          type: array
          items:
            $ref: '#/components/schemas/User'
        residents:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total_specialists:
          type: integer
      required:
        - lab_unit
        - disease
        - ophthalmologists
        - residents
        - total_specialists

    LabUnitReference:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hospital_id:
          type: integer
          format: int64
      required:
        - id
        - name
        - hospital_id

    DiseaseReference:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name

    LabUnitSpecialistsSummary:
      type: object
      properties:
        lab_unit:
          $ref: '#/components/schemas/LabUnitReference'
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/DiseaseSpecialistSummary'
      required:
        - lab_unit
        - diseases

    DiseaseSpecialistSummary:
      type: object
      properties:
        disease:
          $ref: '#/components/schemas/DiseaseReference'
        ophthalmologists:
          type: array
          items:
            $ref: '#/components/schemas/User'
        ophthalmologist_count:
          type: integer
        residents:
          type: array
          items:
            $ref: '#/components/schemas/User'
        resident_count:
          type: integer
        total_specialists:
          type: integer
      required:
        - disease
        - ophthalmologists
        - ophthalmologist_count
        - residents
        - resident_count
        - total_specialists

    UserDiseaseSpecializations:
      type: object
      properties:
        success:
          type: boolean
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Disease'
      required:
        - success

    DiseaseSpecializationRequest:
      type: object
      properties:
        disease_ids:
          type: array
          items:
            type: integer
            format: int64
      required:
        - disease_ids

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    UploadJobStatus:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        job_status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
      required:
        - job_id
        - job_status
        - items

    JobItem:
      type: object
      properties:
        filename:
          type: string
        state:
          type: string
        detail:
          type: string
      required:
        - filename
        - state

    UploadJobStatusByToken:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
      required:
        - job_id
        - status
        - items

  responses:
    Unauthorized:
      description: Unauthorized access
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error
    Forbidden:
      description: Forbidden access
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error

