          description: Operation scope check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  operation:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # ADMIN USERS
  # ========================================================================
  /admin/users:
    get:
      summary: List users (admin)
      description: Returns list of users with filtering options
      tags: [Admin Users]
      security:
