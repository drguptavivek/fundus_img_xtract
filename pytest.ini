[tool:pytest]
# Test discovery paths
testpaths = 
    tests/unit
    tests/integration
    tests/e2e/pytest
    tests/regression
    tests/performance
    tests/security

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    # Show test categories in output
    -ra

# Test markers for categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interaction
    e2e: End-to-end tests for complete workflows
    regression: Regression tests for bug prevention
    performance: Performance and load tests
    security: Security-related tests
    slow: Tests that take longer to run
    fast: Quick tests
    auth: Authentication and authorization tests
    rbac: Role-based access control tests
    abac: Attribute-based access control tests
    rate_limiting: Rate limiting tests
    api: API endpoint tests
    routes: Route integration tests
    models: Database model tests
    utils: Utility function tests
    grading: Grading workflow tests
    uploads: File upload tests
    thumbnails: Thumbnail processing tests
    analytics: Analytics and reporting tests
    cleanup: Cleanup functionality tests
    csrf: CSRF protection tests
    session: Session management tests
    db: Database interaction tests
    redis: Redis-dependent tests
    requires_redis: Tests that require Redis connection
    requires_postgres: Tests that require PostgreSQL connection
    requires_external: Tests that require external services

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PIL.*
    ignore::UserWarning:psutil.*
    # Flask-Limiter warnings
    ignore::DeprecationWarning:flask_limiter.*
    ignore::UserWarning:flask_limiter.*

# Test timeout (5 minutes for long-running tests)
timeout = 300
timeout_method = thread

# Coverage options (when using --cov)
[coverage:run]
source = .
omit =
    tests/*
    .venv/*
    */migrations/*
    */site-packages/*
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod