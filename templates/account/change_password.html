{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Change Password</h1>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post"
            action="{{ url_for('account.change_password_self') }}"
            novalidate>
        {{ csrf_field() }}

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" value="{{ username }}" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" id="current_password" name="current_password"
                   type="password" required autocomplete="current-password">
          </div>
          <div class="col-12">
            <div class="alert alert-info mb-0" role="alert">
              A strong password will be auto-generated after verification.
            </div>
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-primary" type="submit">Change password</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('account.profile') }}">Back to profile</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block page_scripts %}{% endblock %}
