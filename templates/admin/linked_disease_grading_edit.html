{% extends "base.html" %}

{% block title %}Edit Linked Disease Grading{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Linked Disease Grading</h2>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.edit_linked_disease_grading', link_id=link.id) }}">
                {{ csrf_field() }}
                <input type="hidden" name="primary_disease_id" value="{{ link.primary_disease_id }}">
                <input type="hidden" name="linked_disease_id" value="{{ link.linked_disease_id }}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Primary Disease</label>
                        <select class="form-select" disabled>
                            {% for disease in diseases %}
                                <option value="{{ disease.id }}" {% if disease.id == link.primary_disease_id %}selected{% endif %}>
                                    {{ disease.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Linked Disease</label>
                        <select class="form-select" disabled>
                            {% for disease in diseases %}
                                <option value="{{ disease.id }}" {% if disease.id == link.linked_disease_id %}selected{% endif %}>
                                    {{ disease.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-4">
                        <label for="display_order" class="form-label">Display Order</label>
                        <input type="number" class="form-control" id="display_order" name="display_order" value="{{ link.display_order }}">
                    </div>
                    <div class="col-md-4">
                        <label for="is_active" class="form-label">Status</label>
                        <select class="form-select" id="is_active" name="is_active">
                            <option value="1" {% if link.is_active %}selected{% endif %}>Active</option>
                            <option value="0" {% if not link.is_active %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>

                <p class="text-muted mt-3 mb-0">To relink a disease to a different primary, delete this link and create a new one.</p>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a class="btn btn-secondary" href="{{ url_for('admin.linked_disease_gradings_list') }}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
