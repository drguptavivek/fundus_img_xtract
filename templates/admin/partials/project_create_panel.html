{% from "_forms.html" import csrf_field %}

<div class="card shadow-sm" id="project-detail-panel">
  <div class="card-header">
    <div class="fw-semibold">Create Project</div>
    <div class="small text-muted">Define the project first, then assign investigators, upload profiles, and uploaders.</div>
  </div>
  <div class="card-body">
    <form method="post"
          action="{{ url_for('fundus_api.create_upload_profile_project') }}"
          hx-post="{{ url_for('fundus_api.create_upload_profile_project') }}"
          hx-swap="none"
          data-json-api-htmx>
      {{ csrf_field() }}
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label" for="new_project_title">Project Title</label>
          <input class="form-control" id="new_project_title" name="title" maxlength="255" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="new_project_code">Project Code</label>
          <input class="form-control text-uppercase" id="new_project_code" name="code" maxlength="64" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="new_project_description">Description</label>
          <textarea class="form-control" id="new_project_description" name="description" rows="1"></textarea>
        </div>
        <div class="col-12 text-end">
          <button class="btn btn-primary" type="submit">Create Project</button>
        </div>
      </div>
    </form>
  </div>
</div>
