{% from "_forms.html" import csrf_field %}

<div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post"
            action="{{ url_for('fundus_api.create_upload_profile_project') }}"
            hx-post="{{ url_for('fundus_api.create_upload_profile_project') }}"
            hx-swap="none"
            data-json-api-htmx>
        {{ csrf_field() }}
        <div class="modal-header">
          <h5 class="modal-title" id="createProjectModalLabel">Create Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="title">Project Title</label>
            <input class="form-control" id="title" name="title" maxlength="255" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="code">Project Code</label>
            <input class="form-control text-uppercase" id="code" name="code" maxlength="64" required>
          </div>
          <div class="mb-0">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Create Project</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="editProjectModal" tabindex="-1" aria-labelledby="editProjectModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post"
            action=""
            hx-post=""
            hx-swap="none"
            data-json-api-htmx
            data-project-edit-form>
        {{ csrf_field() }}
        <div class="modal-header">
          <h5 class="modal-title" id="editProjectModalLabel">Edit Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="edit_project_title">Project Title</label>
            <input class="form-control" id="edit_project_title" name="title" maxlength="255" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="edit_project_code">Project Code</label>
            <input class="form-control text-uppercase" id="edit_project_code" name="code" maxlength="64" required>
          </div>
          <div class="mb-0">
            <label class="form-label" for="edit_project_description">Description</label>
            <textarea class="form-control" id="edit_project_description" name="description" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save Project</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="addInvestigatorModal" tabindex="-1" aria-labelledby="addInvestigatorModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post"
            action="{{ url_for('fundus_api.add_upload_profile_investigator') }}"
            hx-post="{{ url_for('fundus_api.add_upload_profile_investigator') }}"
            hx-swap="none"
            data-json-api-htmx>
        {{ csrf_field() }}
        <div class="modal-header">
          <h5 class="modal-title" id="addInvestigatorModalLabel">Assign Project Investigator</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="investigator_project_id">Project</label>
            <select class="form-select" id="investigator_project_id" name="project_id" required>
              <option value="">Select project</option>
              {% for project in projects %}
              <option value="{{ project.id }}">{{ project.title }} ({{ project.code }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="investigator_user_id">Investigator</label>
            <select class="form-select" id="investigator_user_id" name="user_id" required>
              <option value="">Select user</option>
              {% for user in users %}
              <option value="{{ user.id }}">{{ user.full_name or user.username }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-0">
            <label class="form-label" for="role">Role</label>
            <select class="form-select" id="role" name="role">
              <option value="principal_investigator">Principal Investigator</option>
              <option value="co_investigator" selected>Co-Investigator</option>
              <option value="coordinator">Coordinator</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Assign Investigator</button>
        </div>
      </form>
    </div>
  </div>
</div>
