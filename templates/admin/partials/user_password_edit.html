{% from "_forms.html" import csrf_field %}
<div id="admin-users-workspace" class="container-fluid py-4">
  <div class="card shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <h2 class="h5 mb-0">Reset Password</h2>
        <div class="small text-muted">{{ username or '' }}</div>
      </div>
      <a class="btn btn-sm btn-outline-secondary"
         href="{{ url_for('admin.user_detail', user_id=user.id, format='shell') if user else url_for('admin.users_list', format='partial') }}"
         hx-get="{{ url_for('admin.user_detail', user_id=user.id, format='shell') if user else url_for('admin.users_list', format='partial') }}"
         hx-target="#admin-users-workspace"
         hx-swap="outerHTML"
         hx-push-url="{{ url_for('admin.user_detail', user_id=user.id) if user else url_for('admin.users_list') }}">Back</a>
    </div>
    <div class="card-body">
      {% include "admin/partials/_flash_messages.html" %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="username_display" class="form-label">Username</label>
          <input type="text" class="form-control" id="username_display" value="{{ username or '' }}" readonly autocomplete="username">
        </div>
        <div class="col-md-6">
          <label for="email_display" class="form-label">Email</label>
          <input type="email" class="form-control" id="email_display" value="{{ email or '' }}" readonly autocomplete="email">
        </div>
      </div>

      <form method="post" action="{{ url_for('admin.change_password') }}" hx-post="{{ url_for('admin.change_password') }}" hx-target="#admin-users-workspace" hx-swap="outerHTML" hx-push-url="{{ url_for('admin.user_detail', user_id=user.id) if user else url_for('admin.users_list') }}" class="mt-3">
        {{ csrf_field() }}
        <input type="hidden" name="username" value="{{ username or '' }}">
        <button type="submit" class="btn btn-outline-danger">Reset password</button>
        <a class="btn btn-outline-secondary"
           href="{{ url_for('admin.user_detail', user_id=user.id, format='shell') if user else url_for('admin.users_list', format='partial') }}"
           hx-get="{{ url_for('admin.user_detail', user_id=user.id, format='shell') if user else url_for('admin.users_list', format='partial') }}"
           hx-target="#admin-users-workspace"
           hx-swap="outerHTML"
           hx-push-url="{{ url_for('admin.user_detail', user_id=user.id) if user else url_for('admin.users_list') }}">Cancel</a>
      </form>
    </div>
    <div class="card-footer small text-muted">
      Minimum 10 characters. Use only letters, digits, and @ # ! &; must include uppercase, lowercase, and one of @ # ! &
    </div>
  </div>
</div>
