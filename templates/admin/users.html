{% extends "base.html" %}
{% block title %}Users & Roles{% endblock %}

{% block content %}
{% include "admin/partials/user_list_workspace.html" %}
{% endblock %}

{% block page_scripts %}
{% if csp_script_nonce %}
<script nonce="{{ csp_script_nonce() }}">
{% else %}
<script>
{% endif %}
document.addEventListener('DOMContentLoaded', function() {
  function initUsersWorkspace() {
    const filterInput = document.getElementById('user-filter');
    const userCards = Array.from(document.querySelectorAll('[data-username]'));

    if (filterInput && userCards.length > 0) {
      const applyFilter = () => {
        const query = filterInput.value.trim().toLowerCase();
        userCards.forEach(card => {
          if (!query) {
            card.hidden = false;
            return;
          }

          const username = card.dataset.username || '';
          const userId = card.dataset.userId || '';
          const fullName = card.dataset.fullName || '';
          const email = card.dataset.email || '';
          const matches = (
            username.includes(query) ||
            userId.includes(query) ||
            fullName.includes(query) ||
            email.includes(query)
          );
          card.hidden = !matches;
        });
      };

      filterInput.addEventListener('input', applyFilter);
    }

    const gradingEligibilityElements = document.querySelectorAll('.grading-eligibility');
    const shownLabUnitCountLimit = 4;

    gradingEligibilityElements.forEach(element => {
      const userId = element.getAttribute('data-user-id');

      fetch(`/api/grading-eligibility/users/${userId}/details`)
        .then(response => response.json())
        .then(data => {
          if (data.eligibility_details && Object.keys(data.eligibility_details).length > 0) {
            let eligibilityHtml = '';
            let shownLabUnitCount = 0;
            const totalLabUnits = Object.keys(data.eligibility_details).length;

            for (const labUnitId in data.eligibility_details) {
              const labUnitData = data.eligibility_details[labUnitId];
              if (shownLabUnitCountLimit > 0 && shownLabUnitCount >= shownLabUnitCountLimit) {
                const remainingUnits = totalLabUnits - shownLabUnitCount;
                if (remainingUnits > 0) {
                  eligibilityHtml += `<div><span class="text-muted">and ${remainingUnits} more lab units...</span></div>`;
                }
                break;
              }

              eligibilityHtml += `<div class="mb-1"><strong>${labUnitData.hospital_name} - ${labUnitData.lab_unit_name}</strong>: `;
              for (const diseaseId in labUnitData.diseases) {
                const diseaseData = labUnitData.diseases[diseaseId];
                eligibilityHtml += `<span class="badge bg-success-subtle text-success-emphasis me-1">${diseaseData.disease_name}: ${diseaseData.roles.join(', ')}</span>`;
              }
              eligibilityHtml += '</div>';
              shownLabUnitCount++;
            }

            element.innerHTML = eligibilityHtml;
          } else {
            element.innerHTML = '<span class="text-muted">No grading eligibility</span>';
          }
        })
        .catch(error => {
          console.error('Error fetching grading eligibility:', error);
          element.innerHTML = '<span class="text-muted">Error loading eligibility</span>';
        });
    });
  }

  initUsersWorkspace();

  document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail && event.detail.target && event.detail.target.id === 'admin-users-workspace') {
      initUsersWorkspace();
    }
  });
});
</script>
{% endblock %}
