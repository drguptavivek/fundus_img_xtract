{% set job = result if result is defined and result else job %}
<div class="d-flex align-items-start justify-content-between gap-2 mb-2">
  <div>
    <div class="small fw-semibold">Upload Status</div>
    <div class="small text-muted">Job {{ job.job_token }}</div>
  </div>
  <span class="badge text-bg-{{ 'success' if job.job_status == 'completed' else 'danger' if job.job_status in ['error', 'partial_error'] else 'warning' }}">
    {{ job.job_status|replace('_', ' ')|title }}
  </span>
</div>
<div class="vstack gap-1">
{% for item in job["items"] %}
  <div class="d-flex align-items-start justify-content-between gap-2 small">
    <div class="min-w-0">
      <div class="text-break">{{ item.filename }}</div>
      <div class="text-muted text-break">{{ item.detail or '' }}</div>
    </div>
    <span class="badge text-bg-{{ 'success' if item.state == 'completed' else 'danger' if item.state == 'error' else 'warning' }}">{{ item.state|title }}</span>
  </div>
  {% endfor %}
</div>
