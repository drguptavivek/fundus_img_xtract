{% extends "base.html" %}
{% block title %}Direct Image Upload{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Direct Image Upload</h1>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{ url_for('direct_uploads.upload_index') }}">Uploads Home</a>
      <a class="btn btn-secondary" href="{{ url_for('remedio_zip_uploads.upload_form') }}">Upload ZIPs</a>
      <a class="btn btn-warning" href="{{ url_for('direct_uploads.pregraded_upload') }}">Upload Pregrade</a>
      <a class="btn btn-outline-secondary" href="{{ url_for('jobs.list_recent_jobs') }}">All Jobs</a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div id="direct-upload-form-panel"
           hx-get="{{ url_for('fundus_api.direct_upload_form', project_id=selected_project_id) }}"
           hx-trigger="load"
           hx-swap="innerHTML">
        <div class="card">
          <div class="card-body text-muted small">Loading upload options...</div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div id="direct-upload-workspace"
           hx-get="{{ url_for('fundus_api.direct_upload_workspace') }}"
           hx-trigger="load"
           hx-swap="innerHTML">
        <div class="border rounded p-4 text-muted">Loading recent uploads...</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block page_scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/htmx.min.js') }}?v={{ v }}" defer></script>
<script src="{{ url_for('static', filename='js/upload-profile-options.js') }}?v={{ config.get('ASSETS_VERSION','') }}" defer></script>
{% endblock %}
