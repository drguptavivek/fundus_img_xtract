{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-3">
    <div>
      <h3 class="mb-1">{{ page_title }}</h3>
      <div class="text-muted">Batch job <code>{{ job_token }}</code></div>
    </div>
    <a class="btn btn-outline-secondary" href="{{ url_for('grading.wadhwani_glaucoma_inference_page') }}">Back to Wadhwani Filters</a>
  </div>

  <div
    id="wadhwaniJobStatus"
    hx-get="{{ url_for('grading.wadhwani_glaucoma_inference_job_status_partial', job_token=job_token) }}"
    hx-trigger="load, every 2s"
    hx-swap="innerHTML">
    <div class="card shadow-sm">
      <div class="card-body text-muted">Loading job status…</div>
    </div>
  </div>
</div>
{% endblock %}

{% block page_scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/htmx.min.js') }}?v={{ config.ASSETS_VERSION|default('') }}" defer></script>
<script src="{{ url_for('static', filename='js/wadhwani_glaucoma_inference.js') }}?v={{ config.ASSETS_VERSION|default('') }}" defer></script>
{% endblock %}
