<script>
window.ProjectSync = (function () {
  function csrf() { var m = document.querySelector('meta[name="csrf-token"]'); return m ? m.content : ''; }
  function toast(message, level) {
    var box = document.getElementById('flash-toasts');
    if (!box || !window.bootstrap) { alert(message); return; }
    var el = document.createElement('div');
    el.className = 'toast text-bg-' + (level || 'info') + ' border-0 shadow-sm small';
    el.setAttribute('role', 'alert');
    var body = document.createElement('div'); body.className = 'toast-body py-1'; body.textContent = message;
    el.appendChild(body); box.appendChild(el);
    new bootstrap.Toast(el, { delay: 5000 }).show();
  }
  async function post(url, payload) {
    var res = await fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf(), 'Accept': 'application/json' },
      body: JSON.stringify(payload || {})
    });
    var data = {}; try { data = await res.json(); } catch (e) {}
    if (res.status === 401 && data.error === 'reauth_required' && data.reauth_url) {
      toast('Please confirm your password, then retry.', 'warning');
      window.location.href = data.reauth_url; throw new Error('reauth');
    }
    if (!res.ok) { toast(data.message || ('Request failed (' + res.status + ')'), 'danger'); throw new Error(data.error || 'failed'); }
    return data;
  }
  async function refresh(containerId, url) {
    var res = await fetch(url, { credentials: 'same-origin', headers: { 'HX-Request': 'true' } });
    if (res.ok) { document.getElementById(containerId).outerHTML = await res.text(); }
  }
  return { post: post, refresh: refresh, toast: toast };
})();
</script>
