<div class="row g-3 mb-4">
  {% for metric in metrics %}
  <div class="col-6 col-lg-3">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">{{ metric.label }}</div>
        <div class="display-6 fw-semibold">{{ metric.value }}</div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
