{% extends "base.html" %}

{% block title %}System Analytics{% endblock %}
{% block meta_content %}Public aggregate statistics for the  Eye  Image Manager.{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="text-center mb-4">
    <h1 class="display-5 fw-bold">System Analytics</h1>
    <p class="text-body-secondary mb-0">Aggregate activity across the platform.</p>
  </div>

  <div
    id="public-kpis"
    hx-get="{{ url_for('fundus_api.public_kpis') }}"
    hx-trigger="load"
    hx-swap="innerHTML"
  >
    <div class="text-center py-5" role="status">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <div class="mt-2 text-body-secondary">Loading system statistics…</div>
    </div>
  </div>
</div>
{% endblock %}
