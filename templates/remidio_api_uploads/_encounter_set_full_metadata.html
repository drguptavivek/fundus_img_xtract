{% if detail.full_metadata %}
<details class="mt-3">
  <summary class="btn btn-sm btn-outline-secondary">Full metadata</summary>
  <div class="border rounded bg-body-tertiary mt-2 p-3 overflow-auto" style="max-height: 32rem;">
    <pre class="small mb-0 text-wrap">{{ detail.full_metadata | tojson(indent=2) }}</pre>
  </div>
</details>
{% endif %}
