<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Processing Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      {% for cat, m in msgs %}
        <div class="alert alert-{{cat}}">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Result for {{ zip_name }}</h5>
      <p class="mb-1"><strong>Step:</strong> {{ step|upper }}</p>
      <p class="mb-0"><strong>Status:</strong>
        {% if ok %}<span class="text-success">OK</span>{% else %}<span class="text-danger">ERROR</span>{% endif %}
      </p>
      <p class="mt-2">{{ message }}</p>
      <a class="btn btn-secondary mt-3" href="{{ url_for('form') }}">Upload another</a>
    </div>
  </div>
</div>
</body>
</html>
