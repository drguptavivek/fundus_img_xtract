<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload ZIP → Extract → OCR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h3 class="mb-3">Upload a ZIP</h3>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      {% for cat, m in msgs %}
        <div class="alert alert-{{cat}}">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data" class="card p-3 shadow-sm">
    <div class="mb-3">
      <input type="file" name="file" accept=".zip" class="form-control" required>
      <div class="form-text">We’ll reuse your existing pipeline to extract files, OCR PDFs, and update the DB.</div>
    </div>
    <button class="btn btn-primary">Upload & Process</button>
  </form>
</div>
</body>
</html>
