{% extends "base.html" %}
{% block title %}Upload ZIPs (async){% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-md-10">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Upload ZIP files</h5>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('uploads.upload') }}" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          
          <!-- Hospital Selection -->
          <div class="mb-3">
            <label for="hospital_id" class="form-label">Hospital *</label>
            <select id="hospital_id" name="hospital_id" class="form-select" required>
              <option value="">Select a hospital</option>
              {% for hospital in hospitals %}
              <option value="{{ hospital.id }}">{{ hospital.name }}</option>
              {% endfor %}
            </select>
          </div>
          
          <!-- Lab Unit Selection -->
          <div class="mb-3">
            <label for="lab_unit_id" class="form-label">Lab Unit *</label>
            <select id="lab_unit_id" name="lab_unit_id" class="form-select" required>
              <option value="">Select a lab unit</option>
              {% for lab_unit in lab_units %}
              <option value="{{ lab_unit.id }}" data-hospital="{{ lab_unit.hospital_id }}">{{ lab_unit.name }}</option>
              {% endfor %}
            </select>
          </div>
          
          <!-- File Upload -->
          <div class="mb-3">
            <label for="files" class="form-label">Choose one or more .zip files</label>
            <input id="files" class="form-control" type="file" name="files" multiple accept=".zip" required>
            <div class="form-text">
              Only <code>.zip</code> files • Max {{ per_file_mb }} MB each • Up to {{ max_files }} files per upload
            </div>
          </div>
          
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Upload &amp; Queue</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('jobs.list_recent_jobs') }}">Recent Jobs</a>
            <a class="btn btn-outline-secondary" href="/healthz">Health</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript to filter lab units based on hospital selection -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const hospitalSelect = document.getElementById('hospital_id');
    const labUnitSelect = document.getElementById('lab_unit_id');
    const labUnitOptions = labUnitSelect.querySelectorAll('option[data-hospital]');
    
    hospitalSelect.addEventListener('change', function() {
        const selectedHospitalId = this.value;
        
        // Reset lab unit selection
        labUnitSelect.value = '';
        
        // Show/hide lab units based on hospital selection
        labUnitOptions.forEach(option => {
            if (selectedHospitalId === '' || option.dataset.hospital === selectedHospitalId) {
                option.style.display = '';
            } else {
                option.style.display = 'none';
            }
        });
    });
    
    // Trigger change event on page load to set initial state
    hospitalSelect.dispatchEvent(new Event('change'));
});
</script>
{% endblock %}
