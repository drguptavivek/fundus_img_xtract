<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload ZIPs (async)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h3 class="mb-3">Upload ZIP files</h3>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      {% for cat, m in msgs %}
        <div class="alert alert-{{cat}}">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" action="{{ url_for('uploads.upload_files') }}" enctype="multipart/form-data">
        <div class="mb-2">
          <input class="form-control" type="file" name="files" multiple accept=".zip" required>
          <div class="form-text">
            Only .zip files • Max {{ per_file_mb }} MB each • Up to {{ max_files }} files per upload
          </div>
        </div>
        <button class="btn btn-primary">Upload & Queue</button>
      </form>
    </div>
  </div>
  <br/>
  <div class="mb-3">
  <a class="btn btn-outline-secondary" href="/jobs">Recent Jobs</a>
  <a class="btn btn-outline-secondary" href="/healthz">Health</a>
</div>
</div>





</body>
</html>
